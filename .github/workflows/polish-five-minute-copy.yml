name: Polish 5-minute battle copy

on:
  push:
    branches:
      - five-minute-matches
    paths:
      - ".github/workflows/polish-five-minute-copy.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish copy
        run: python3 .github/scripts/polish_5min_copy.py

      - name: Validate JavaScript
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('fatebound.html', 'utf8');
          const re = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, i = 0, checked = 0;
          while ((m = re.exec(html))) {
            i++;
            const attrs = m[1] || '';
            const code = m[2] || '';
            if (/type\s*=\s*["']module["']/i.test(attrs) || !code.trim()) continue;
            new vm.Script(code, { filename: 'inline-' + i + '.js' });
            checked++;
          }
          console.log('Parsed ' + checked + ' classic script blocks');
          JS
          git diff --check

      - name: Commit polish
        run: |
          git config user.name "ChatGPT"
          git config user.email "midblade4295@users.noreply.github.com"
          git rm .github/workflows/polish-five-minute-copy.yml
          git rm .github/scripts/polish_5min_copy.py
          git add fatebound.html
          git commit -m "Polish five-minute battle copy"
          git push origin HEAD:five-minute-matches

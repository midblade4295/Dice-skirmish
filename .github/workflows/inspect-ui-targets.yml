name: Inspect UI targets
on:
  push:
    branches: [battle-ui-redesign]
    paths: [".github/workflows/inspect-ui-targets.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("fatebound.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          pats=[
            "function enterTower","function leaveTower","function showMap","function renderMap",
            "function showScreen","function homeHub","function finishMatch","function endMatch",
            "$('again')","$('mapBack')","data-tab","addEventListener('click'",
            "id=\"battle\"","id=\"warmap\"","id=\"end\"","id=\"setup\"",
            "class=\"rollbar\"","class=\"score\"","<nav","</nav>",
            "battleExcitement","paintAlert","paintOrder","paintRival","paintPhase","paintMomentum",
            "matchHighlights","function excitementTick","setInterval"
          ]
          out=[]
          seen=set()
          for pat in pats:
            out.append(f"\n===== {pat} =====")
            hits=[i for i,l in enumerate(lines) if pat in l]
            out.append("hits="+str([i+1 for i in hits[:20]]))
            for i in hits[:6]:
              a=max(0,i-18);b=min(len(lines),i+35)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              out.append(f"--- {a+1}-{b} ---")
              for j in range(a,b):
                line=lines[j]
                if len(line)>900: line=line[:900]+" …[truncated]"
                out.append(f"{j+1:05d}: {line}")
          Path("ui-targets.txt").write_text("\n".join(out),encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ui-targets
          path: ui-targets.txt

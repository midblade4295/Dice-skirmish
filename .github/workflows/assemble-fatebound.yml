name: Finalize Fatebound branding
on:
  push:
    paths:
      - '_fatebound_upload/**'
      - '.github/workflows/assemble-fatebound.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble Fatebound
        shell: bash
        run: |
          set -euo pipefail
          cat _fatebound_upload/part-* > fatebound.html
          if grep -Eiq 'dice[ -]?skirmish|skirmish' fatebound.html; then
            echo "Old Dice Skirmish branding still exists"
            exit 1
          fi
          test "$(wc -c < fatebound.html)" -eq 10500177
      - name: Commit finalized Fatebound build
        shell: bash
        run: |
          rm -rf _fatebound_upload
          rm -f .github/workflows/assemble-fatebound.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Fatebound branding"
          git push

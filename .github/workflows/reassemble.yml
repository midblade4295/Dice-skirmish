name: Reassemble Dice Skirmish build
on:
  push:
    paths:
      - '.parts/READY'
permissions:
  contents: write
jobs:
  reassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify
        shell: bash
        run: |
          cat .parts/[0-9][0-9][0-9].b64 > /tmp/dice-build.b64
          base64 --decode /tmp/dice-build.b64 > dice-skirmish-91-5.html
          sha256sum -c .parts/sha256.txt
      - name: Commit final build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dice-skirmish-91-5.html
          git commit -m "Add Dice Skirmish 91.5 standalone build"
          git push

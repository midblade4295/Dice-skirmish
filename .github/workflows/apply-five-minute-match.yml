name: Apply 5-minute matches

on:
  push:
    branches:
      - five-minute-matches
    paths:
      - ".github/workflows/apply-five-minute-match.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_five_minute_match.py

      - name: Validate JavaScript
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('fatebound.html', 'utf8');
          const re = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, i = 0, checked = 0;
          while ((m = re.exec(html))) {
            i++;
            const attrs = m[1] || '';
            const code = m[2] || '';
            if (/type\s*=\s*["']module["']/i.test(attrs) || !code.trim()) continue;
            new vm.Script(code, { filename: 'inline-' + i + '.js' });
            checked++;
          }
          console.log('Parsed ' + checked + ' classic script blocks');
          JS
          git diff --check

      - name: Commit patched source
        run: |
          git config user.name "ChatGPT"
          git config user.email "midblade4295@users.noreply.github.com"
          git rm .github/workflows/apply-five-minute-match.yml
          git rm .github/scripts/apply_five_minute_match.py
          git add fatebound.html
          git commit -m "Shorten guild battles to five minutes"
          git push origin HEAD:five-minute-matches

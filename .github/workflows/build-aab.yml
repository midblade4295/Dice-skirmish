name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename HTML to fatebound.html
        run: |
          if [ -f dice-skirmish-91-5.html ] && [ ! -f fatebound.html ]; then
            git mv dice-skirmish-91-5.html fatebound.html
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git commit -m "Rename game HTML to fatebound.html"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Copy game HTML into app assets
        run: |
          mkdir -p android/app/src/main/assets
          if [ -f fatebound.html ]; then
            cp fatebound.html android/app/src/main/assets/index.html
          else
            cp dice-skirmish-91-5.html android/app/src/main/assets/index.html
          fi

      - name: Create upload keystore
        run: |
          keytool -genkeypair -keystore /tmp/upload.jks -storetype JKS \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass FateboundUpload26 -keypass FateboundUpload26 \
            -dname "CN=Fatebound, OU=Game, O=midblade4295, C=US"
          echo "SIGNING_KEYSTORE=/tmp/upload.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=FateboundUpload26" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=upload" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=FateboundUpload26" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fatebound-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload signing key (keep this private)
        uses: actions/upload-artifact@v4
        with:
          name: fatebound-upload-keystore
          path: /tmp/upload.jks

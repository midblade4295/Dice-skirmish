name: Tune battle excitement systems

on:
  push:
    branches:
      - battle-excitement-tuning
    paths:
      - ".github/workflows/tune-battle-excitement.yml"

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tuning
        run: python3 .github/scripts/tune_battle.py

      - name: Validate JavaScript
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('fatebound.html','utf8');
          const re=/<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let m,i=0,checked=0;
          while((m=re.exec(html))){
            i++;
            const attrs=m[1]||'',code=m[2]||'';
            if(/type\s*=\s*["']module["']/i.test(attrs)||!code.trim()) continue;
            new vm.Script(code,{filename:'inline-'+i+'.js'});
            checked++;
          }
          console.log('Parsed '+checked+' classic scripts');
          JS
          git diff --check

      - name: Commit tuning
        run: |
          git config user.name "ChatGPT"
          git config user.email "midblade4295@users.noreply.github.com"
          git rm .github/workflows/tune-battle-excitement.yml
          git rm .github/scripts/tune_battle.py
          git add fatebound.html
          git commit -m "Tune battle excitement rewards and counterplay"
          git push origin HEAD:battle-excitement-tuning

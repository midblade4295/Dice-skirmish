name: Extract battle UI source
on:
  push:
    branches: [battle-ui-redesign]
    paths: [".github/workflows/extract-battle-ui.yml"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract targeted source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("fatebound.html").read_text(encoding="utf-8")
          lines=s.splitlines()
          needles=[
            'function ensureUi(){',
            'function paintOrder(',
            'function paintAlert(',
            'function paintRival(',
            'function tickExcitement(',
            'function homeHub(){',
            'function showScreen(',
            'function enterTower(',
            'function finishMatch(){',
            '<div id="battle"',
            '<div id="warmap"',
            '<div class="overlay" id="end"',
            '<nav',
          ]
          out=[]
          for needle in needles:
            hits=[i for i,l in enumerate(lines) if needle in l]
            out.append(f"===== {needle} =====")
            for i in hits[:2]:
              a=max(0,i-18); b=min(len(lines),i+130)
              out.extend(f"{j+1:05d}: {lines[j]}" for j in range(a,b))
          Path(".github/battle-ui-inspection.txt").write_text("\n".join(out),encoding="utf-8")
          PY
          git config user.name "ChatGPT"
          git config user.email "midblade4295@users.noreply.github.com"
          git add .github/battle-ui-inspection.txt
          git commit -m "Capture battle UI source inspection"
          git push origin HEAD:battle-ui-redesign

name: Apply battle UI v2
# rerun after all verified patch parts uploaded

on:
  push:
    branches: [battle-ui-redesign]
    paths:
      - ".github/workflows/apply-battle-ui-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and apply redesign
        shell: bash
        run: |
          cat .github/patchparts/battle-ui-v2-*.b64 > /tmp/battle-ui-v2.b64
          test "$(wc -c < /tmp/battle-ui-v2.b64)" -eq 47304
          echo "842a66d68b2e7240f56b7a68dcd8aefce68b0aa3f393d44199acc66e22d038b9  /tmp/battle-ui-v2.b64" | sha256sum -c -
          base64 -d /tmp/battle-ui-v2.b64 > /tmp/apply_battle_ui_v2.py
          echo "007d7d6e6557ff6fb96d43de83555e69b2ee80981f6dc6e81807dd7cbe197fd6  /tmp/apply_battle_ui_v2.py" | sha256sum -c -
          python3 /tmp/apply_battle_ui_v2.py

      - name: Validate HTML JavaScript
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('fatebound.html','utf8');
          const re = /<script([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, i = 0, checked = 0;
          while ((m = re.exec(html))) {
            i++;
            const attrs = m[1] || '', code = m[2] || '';
            if (/type\s*=\s*["']module["']/i.test(attrs) || !code.trim() || /\bsrc\s*=/.test(attrs)) continue;
            new vm.Script(code, {filename:'inline-'+i+'.js'});
            checked++;
          }
          console.log('Parsed '+checked+' classic inline script blocks');
          JS
          grep -q 'content="92-battle-ui-v2"' fatebound.html
          grep -q '__FATEBOUND_BATTLE_UI_V2__' fatebound.html
          grep -q 'versionCode 9' android/app/build.gradle
          grep -q 'versionName "1.0.8"' android/app/build.gradle
          git diff --check

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "midblade4295@users.noreply.github.com"
          git rm .github/workflows/apply-battle-ui-v2.yml
          git rm -f .github/workflows/inspect-battle-ui.yml .github/workflows/inspect-ui-targets.yml
          git rm -rf .github/patchparts
          git add fatebound.html android/app/build.gradle
          git commit -m "Redesign battle UI for five-minute combat"
          git push origin HEAD:battle-ui-redesign
